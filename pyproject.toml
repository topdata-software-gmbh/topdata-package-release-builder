[project]
name = "topdata-package-release-builder"
version = "0.1.0"
description = "Build and package Shopware 6 plugins for release"
# 3.10 is the real floor: PEP 604 unions (`str | None`) are evaluated at
# import time in cli.py, workflow.py and pdf.py.
requires-python = ">=3.10"
dependencies = [
    "rich>=13.0.0",
    "click>=8.0.0",
    "pytz",
    "python-dotenv",
    "InquirerPy>=0.3.4",
    "requests",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
sw-build = "topdata_package_release_builder.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# Correctness rules only. The codebase predates linting, so the default set is
# deliberately narrow: `F` (pyflakes: unused/undefined names), `E9` (syntax) and
# `B` (bugbear). Whitespace, import-order and pyupgrade rules are available via
# `--select` but are not enforced until the legacy modules are brought up to
# date -- adding them here would mean reformatting modules this change does not
# otherwise touch.
select = ["E9", "F", "B"]
ignore = [
    "B008",  # click decorators call functions in argument position
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

